name: Deploy on Tag

on:
  push:
    tags:
      - 'v*.*.*'  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
         include:
          # - component: 'admin'
          #   path: './packages/admin'
          - component: 'authentication'
            path: './packages/authentication'
          # - component: 'client'
          #   path: './packages/client'
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        
    - name: Build and push Docker image
      env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          VITE_VIVALENCE_ADMIN_PATH: ${{ secrets.VITE_VIVALENCE_ADMIN_PATH }}
          VITE_VIVALENCE_USER_PATH: ${{ secrets.VITE_VIVALENCE_USER_PATH }}
          SERVICE_NLP_URL: ${{ secrets.SERVICE_NLP_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANYSCALE_API_KEY: ${{ secrets.ANYSCALE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYSTEM_MODE: ${{ secrets.SYSTEM_MODE }}

      run: |
        docker build --progress=plain -t ${{ matrix.component }} ${{ matrix.path }}
        docker images --format "{{.Repository}}: {{.Size}}"
        docker save ${{ matrix.component }} | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker load"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
         include:
          # - component: 'admin'
          #   path: './packages/admin'
          - component: 'authentication'
            path: './packages/authentication'
          # - component: 'client'
          #   path: './packages/client'
    steps:
    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
    - name: Deploy to server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker compose -f /opt/server/docker-compose.yml up -d ${{ matrix.component }}"
