name: Deploy on Tag

on:
  push:
    branches:
      # Trigger on push to any branch
      # - '*'  
      # Trigger on push main
      - 'main'

    # tags:
    #   - 'v*.*.*'  # Semantic versioning tags

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ['frontend', 'backend']
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        
    - name: Build and push Docker image
      run: |
        docker build -t ${{ matrix.component }} ./app/${{ matrix.component }}
        docker save ${{ matrix.component }} | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker load"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
    - name: Deploy to server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker-compose -f /opt/server/docker-compose.yml up -d"
