name: Deploy on Tag

on:
  push:
    branches:
      - main

    # tags:
    #   - 'v*.*.*'  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
         include:
          - component: 'authentication'
            path: './packages/authentication'
          # - component: 'admin'
          #   path: './packages/admin'
          # - component: 'client'
          #   path: './packages/client'
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        
    - name: Build and push Docker image
      run: |
        docker build --progress=plain  -t ${{ matrix.component }} ${{ matrix.path }}
        docker images --format "{{.Repository}}: {{.Size}}"
        docker save ${{ matrix.component }} | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker load"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
         include:
          - component: 'authentication'
            path: './packages/authentication'
          # - component: 'admin'
          #   path: './packages/admin'
          # - component: 'client'
          #   path: './packages/client'
    steps:
    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
    - name: Deploy to server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker compose -f /opt/server/docker-compose.yml up -d ${{ matrix.component }}"
