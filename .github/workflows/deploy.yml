name: Deploy on Tag

on:
  push:
    branches:
      - '*'  # Trigger on push to any branch

    # tags:
    #   - 'v*.*.*'  # Semantic versioning tags

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    # - name: Add SSH key
    #   run: |
    #     mkdir -p ~/.ssh
    #     echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
    #     chmod 600 ~/.ssh/id_rsa
    #     ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Test ssh
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful.'"

    - name: Build and push Docker images
      run: |
        docker build -t v-test -f Dockerfile.test .
        docker save v-test | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker load"
