<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["northsea","parchment","porcelain","datasette"],"default":"northsea"},"$preview":{"width":940,"height":600}}'>
const TIERS = ['frugal', 'fast', 'balanced', 'capable', 'unleashed', 'eager'];
const EFFORTS = ['none', 'low', 'medium', 'high'];
const VIEWS = ['docked', 'full', 'closed', 'messenger'];
const SIDES = ['left', 'right', 'top', 'bottom'];
const LENSES = ['turns', 'harness', 'repl'];
const MARKDOWNS = ['pretty', 'plain'];
const THEMES = ['northsea', 'parchment', 'porcelain', 'datasette'];
const GROUPS = ['terminals', 'threads', 'modes', 'buffers', 'activity', 'harness', 'display', 'box',
  'system', 'control'];
const FILTERS = ['all', 'activity', 'repl', 'net', 'faults'];
const MEMO = '/daemon/memo/mode/srs/memo';
const SRS = '/daemon/memo/mode/domain/srs';
const HELLO = '/daemon/hello/mode/demo/hello-world';
const MAGISTER = 'You are Magister, a Roman schoolmaster of spaced repetition, living inside a vivalence daemon.\n\nYour learner studies the language named below from their own: the classical tongue and the church’s. Beside you sits a frame of flashcards; a grade given there or here moves the one schedule. Your job is to run review sessions in conversation: fetch what is due, quiz one card at a time, judge the answer honestly, grade the card so its schedule evolves, and teach where a card keeps failing.\n\nThe loop:\n1. Call review to pull cards. If nothing is due and nothing is untouched, say so and offer a rest.\n2. Present one card as a question: give the learning side only.\n3. The learner answers. Judge it: exact or clearly equivalent means GOOD, hesitant or partial means HARD, effortless and instant means EASY, wrong or blank means AGAIN.\n4. Call grade with the card’s slug and your judgment, then move to the next card.\n5. When the batch is done, summarize: how many, how they went, what is due next.\n\n…';
const HELLO_TEXT = 'You are the vivalence hello-world demo, talking to the operator of this machine.\nTwo or three plain sentences unless the answer genuinely needs more.\n\nEvery reply is a budget: at most THREE tool calls, then answer. A call that returned nothing useful is an answer too — say so, do not call again with the same input.\n\nWork each reply in this order:\n1. LOOK. … viva_doctor, ONCE. … web_search ONCE, then web_read the one article …\n2. DECIDE. No tool. Is this an answer, a page, or research?\n3. ACT, one call. … generator_view_render … or the research tool in ONE call with the whole brief.\n4. CHANGE, only when asked. … ONE generator_view_revise on the same page …\n\n…';
const FORMAT_TEXT = 'The dock renders markdown: # heading through ######, **bold**, *italic* or _italic_, `code`, [text](https://url), > quote, - bullet or 1. numbered, --- rule, ```lang fenced blocks, and | pipe | tables | above a |---|---| row.\nNothing else renders — no images, no HTML, no strikethrough, no footnotes, no task boxes — so reach for a list or a table only when the answer is genuinely shaped like one.';
const SRS_TEXT = 'This daemon schedules its cards with SM-2, the scheduler Anki ships. A card’s status climbs untouched → unknown → learning → known → graduated … A grade is one of AGAIN · HARD · GOOD · EASY … Every grade is traced, so a card’s history is real. A suspended card is dealt by nothing until it is resumed; a leech is a card lapsed again and again.';

const v = (k, value, more = {}) => ({ k, v: value, ...more });
const to = (k, value, go, more = {}) => ({ k, v: value, go, ...more });
const ed = (k, path, edit, more = {}) => ({ k, path, edit, ...more });
const arg = (name, type, required, about = '') => v(required ? name : `${name}?`, type, { q: about });
const rec = (t, k, value = '', c = '') => ({ t, k, v: value, c });
const worn = (name, value = '') => v(`● ${name}`, value, { cls: 'is-worn' });
const cast = (name, value = '') => v(`○ ${name}`, value, { cls: 'is-cast' });
const n = (id, name, more = {}, kids = []) => ({ id, name, ...more, kids });
const inputs = (args) => (args === null ? [cast('not captured')] : args.length ? args : [cast('none', '{}')]);
const SEEN = { [`${MEMO}:srs/lookup`]: ['lookup', 'hallu', 'tool'] };

const tool = (pre, owner, path, valence, args, more = {}) => n(`${pre}.t.${path}`, path.split('/').at(-1), {
  leaf: true, kind: 'tool', as: path.replaceAll('/', '_'), title: path.replaceAll('/', '_'),
  ref: `${owner}/harness/tools/${path}`, acts: ['copy'],
  tr: SEEN[`${owner}:${path}`] ?? (owner === MEMO ? 'turns' : 'none'),
  secs: [
    ['effect', [v('valence', valence), v('load', 'eager')]],
    ['input', inputs(args)],
    ['address', [v('path', `${owner}/harness/tools/${path}`), v('as', path.replaceAll('/', '_'), { q: 'model sees' }),
      ...(more.from ? [to('from', more.from[0], more.from[1])] : [])]],
  ],
});
const branch = (pre, owner, path, kids) => n(`${pre}.t.${path}`, path.split('/').at(-1), {
  quiet: String(kids.length), kind: 'branch', title: path, ref: `${owner}/harness/tools/${path}`, tr: 'none',
}, kids);

const primer = (pre, owner, name, text, rows = []) => n(`${pre}.p.${name}`, name, {
  leaf: true, kind: 'primer', quiet: 'eager', title: name, ref: `${owner}/harness/primer/${name}`,
  tr: owner === MEMO ? 'turns' : 'none', acts: ['read'], peek: text,
  secs: [['own', [v('load', 'eager'), v('path', `/${name}`), ...rows]]],
});

const reference = (pre, owner, name, rows = []) => n(`${pre}.r.${name}`, name, {
  leaf: true, quiet: 'faculty', kind: 'reference', title: name, ref: `${owner}/harness/${name}`,
  tr: owner === MEMO && name === 'dialogue' ? 'turns' : 'none',
  secs: [['own', [v('faculty', name), v('route', `${owner}/harness/${name}`), ...rows]]],
});

const route = (pre, owner, path, shapes, valence, args, out = []) => n(`${pre}.a.${path}`, path, {
  leaf: true, quiet: shapes, kind: 'route', title: path, ref: `${owner}${path}`, tr: 'none', acts: ['copy'],
  secs: [
    ['effect', [v('valence', valence), v('shapes', shapes)]],
    ['input', inputs(args)],
    ...(out.length ? [['output', out]] : []),
  ],
});

const trait = (pre, owner, name, quiet, rows) => n(`${pre}.x.${name}`, name, {
  leaf: true, quiet, kind: 'trait', title: name, ref: `${owner}#${name}`, tr: 'none',
  secs: [['brings', rows]],
});

const command = (id, nature, { rank = '', chord = '', valence = '', args = [], send = true }) => n(id, nature, {
  leaf: true, quiet: chord || rank, kind: 'command', title: nature, ref: nature, tr: `cmd:${nature}`,
  acts: send && args.every((a) => a.k.endsWith('?')) ? ['send'] : [],
  secs: [
    ['own', [v('nature', nature), v('rank', rank || 'listed'), v('chord', chord || '—')]],
    ['effect', [valence ? v('valence', valence) : cast('valence', 'not captured')]],
    ['input', args.length ? args : [cast('none', '{}')]],
  ],
});

const mode = (id, name, title, ref, rows, { secs = [], ...more } = {}, kids = []) => n(id, name, {
  sign: '◇', leaf: kids.length === 0, kind: 'mode', title, ref, tr: 'none', acts: ['attach'],
  ...more, secs: [['own', rows], ...secs],
}, kids);

const FACULTIES = ['verbatim', 'dialogue', 'object', 'choice', 'picture'];

const THREAD = [
  ['own', [v('id', '01a1e526-970c-723d-81bd-f6d81c47d9ec'), v('phase', 'manual'), v('counter', '1'),
    v('intent', 'null'), v('parent', 'null'), v('createdAt', '16:17:53.932'), { k: 'updatedAt', stamp: true }]],
  ['traits', [
    worn('INTELLIGENT'),
    ed('tier', 'thread.tier', 'select', { opts: TIERS, cls: 'is-sub' }),
    ed('effort', 'thread.effort', 'choice', { opts: EFFORTS, cls: 'is-sub' }),
    ed('rounds', 'thread.rounds', 'step', { min: 1, max: 100, step: 1, q: '/ 100', cls: 'is-sub' }),
    worn('VOCAL', '{}'),
    ed('LABELED', 'thread.label', 'field', { trait: 'LABELED' }),
    cast('QUEUEING', 'depth 1'),
    cast('AIMED', '{}'),
    cast('MASKED', '{}'),

  ['relations', [
    to('mode', '◇ srs/memo', 'srs-memo', { q: 'was home/probe · /mode moved it' }),
    to('user', 'localhost', 'lighthouse', { q: 'whole user object' }),

  ['stores', [
    to('$turns', '8', 'turns', { bang: '!', q: 'computed · by createdAt' }),
    to('$buffers', '1', 'buffers', { q: 'computed · by index' }),
    to('$activities', '0', 'activities', { q: 'computed' }),
    v('$children', '0'),
    v('turns · buffers · children', '[] [] []', { q: 'mikro, stay empty', cls: 'is-cast' }),
  ]],
];


const MEMO_TOOLS = [

    arg('limit', 'integer 1–20', false, 'five when left out'), arg('symbols', 'string[]', false, 'see srs_topics')]),
  tool('memo', MEMO, 'grade', 'Grade the card the learner just answered — AGAIN wrong or blank, HARD right with struggle, GOOD right, EASY instant. Evolves its SM-2 schedule, traces the grade on this thread.', [
    arg('card', 'string', true, 'amor.noun'), arg('signal', 'AGAIN · HARD · GOOD · EASY', true)]),

  branch('memo', MEMO, 'srs', [

    tool('memo', MEMO, 'srs/sentences', 'The sentences that hold a word’s lemma — context for a word the learner keeps missing.', [

    tool('memo', MEMO, 'srs/topics', 'Every topic and level of the deck with its card count — what a session can be narrowed to.', [], { from: ['◇ domain/srs', 'domain-srs'] }),

    tool('memo', MEMO, 'srs/suspend', 'Take a card out of every deal until it is resumed — for a leech, or a card the learner asks to skip.', [
      arg('card', 'string', true), arg('reason', 'string', true, 'leech')], { from: ['◇ domain/srs', 'domain-srs'] }),
    tool('memo', MEMO, 'srs/resume', 'Deal a suspended card again.', [arg('card', 'string', true)], { from: ['◇ domain/srs', 'domain-srs'] }),
  ]),
];

const HELLO_TOOLS = [
  branch('hello', HELLO, 'viva', [
    tool('hello', HELLO, 'viva/doctor', 'The live vivalence setup on this machine, as JSON — the same record viva instance/doctor prints, read straight off paladin.', []),
  ]),
  branch('hello', HELLO, 'web', [
    tool('hello', HELLO, 'web/search', 'Search Wikipedia, the English encyclopedia. Every result is an article: its title, its address and a snippet.', [
      arg('query', 'string', true, 'flamingo'), arg('count', 'integer 1–100', false, 'eight')]),
    tool('hello', HELLO, 'web/read', 'Open one URL and read the article out of it — the body as markdown, the links inside it, and its images.', [
      arg('url', 'url', true, 'http · https, public')]),

  tool('hello', HELLO, 'research', 'Research a subject and leave a page about it on the operator’s screen. Searches Wikipedia, follows links, draws a report into a buffer.', [
    arg('brief', 'string', true, 'the whole brief, in prose')]),
  branch('hello', HELLO, 'generator', [
    branch('hello', HELLO, 'generator/view', [
      tool('hello', HELLO, 'generator/view/render', 'Draw a page. Submit a COMPLETE Svelte 5 component as source; it is compiled, content-addressed and mounted.', [
        arg('source', 'svelte', true), arg('label', 'string', true), arg('data', 'any', false)]),
      tool('hello', HELLO, 'generator/view/revise', 'Iterate a page you already drew: the SAME buffer gets new source, label and/or data and re-mounts in place.', [
        arg('buffer', 'string', true, 'buffer id'), arg('source', 'svelte', false), arg('label', 'string', false), arg('data', 'any', false)]),
      tool('hello', HELLO, 'generator/view/inspect', 'Read a page’s source back by its bundle hash.', null),
      tool('hello', HELLO, 'generator/view/list', 'The pages on this thread.', null),
    ]),
  ]),
];

const harness = (pre, owner, tools, primers, refs, rows) => n(`${pre}.harness`, 'harness', {
  quiet: '3 tries', kind: 'harness', title: owner.split('/').at(-1), ref: `${owner}/metadata/harness`, tr: owner === MEMO ? 'turns' : 'none',
  secs: [['own', rows]],
}, [
  n(`${pre}.tools`, 'tools', { quiet: String(tools.flatMap(function leaves(t) { return t.kind === 'tool' ? [t] : t.kids.flatMap(leaves); }).length), kind: 'try', title: 'tools', ref: `${owner}/metadata/harness/tools`, tr: 'none' }, tools),
  n(`${pre}.primer`, 'primer', { quiet: String(primers.length), kind: 'try', title: 'primer', ref: `${owner}/metadata/harness/primer`, tr: 'none' }, primers),
  n(`${pre}.refs`, 'references', { quiet: String(refs.length), kind: 'try', title: 'references', ref: `${owner}/metadata/harness/references`, tr: 'none' }, refs),
]);

const SPEC = n('app', 'app', {
  kind: 'app', title: 'app', ref: 'anima', tr: 'all',
  secs: [
    ['own', [ed('theme', 'app.theme', 'choice', { opts: THEMES, signal: (x) => `/theme ${x}`, q: 'bridge › mask › user' }),
      v('surface', 'anima chrome', { q: 'solid · vite' }), v('controller', 'span app', { q: 'sibling of client · not logged' })]],
    ['box', [v('drivers', 'audio'), v('device', 'microphone · speaker')]],
  ],
}, [
  n('client', 'client', {
    quiet: 'anima', kind: 'client', title: 'anima', ref: 'client', tr: 'b-client',
    secs: [
      ['own', [v('type', 'client'), v('slug', 'anima'), v('controller', 'span client', { q: 'the logger reads it' })]],
      ['mask', [worn('HOME', '/runtime/house/mode/home/probe'), v('modes', '1', { q: 'register' })]],
      ['aperture', [v('serves back', '/terminal/:terminal/repl · /metadata/repl', { q: 'armed by LOOPING' })]],
      ['relations', [to('runtime', 'house', 'runtime'), to('user', 'localhost', 'lighthouse')]],
    ],
  }, [
    n('runtime', 'runtime', {
      quiet: 'house', dot: true, kind: 'runtime', title: 'house', ref: '/runtime/house', tr: 'b-runtime',
      secs: [
        ['own', [v('manifest', 'slug house'), v('reference', '/runtime/house'), v('remote', 'http://localhost:63750/'),
          v('status', 'HEALTHY'), v('connection', 'IDLE', { q: 'one websocket' })]],
        ['metadata', [v('statics', 'serve · remote'), v('aperture', 'mode entities metadata cortex status batch')]],
        ['cortex', [v('faculties', 'dialogue object choice verbatim speech picture'),
          v('dialogue', 'stub-deep · stub-middle · stub-quick', { q: 'provider stub' })]],
        ['entities', [v('daemon', '2'), v('mode', '5', { q: '+1 local' }), v('terminal', '1'), v('thread', '1'), v('turn', '8'),
          v('buffer', '1'), v('activity', '0', { q: 'settled ones leave' })]],
      ],
    }, [
      n('lighthouse', 'lighthouse', {
        quiet: 'localhost', dot: true, kind: 'lighthouse', title: 'localhost', ref: '/lighthouse', tr: 'b-lighthouse',
        secs: [

            v('authority', 'access · refresh', { q: 'jwt' })]],

          ['user', [v('slug', 'localhost'), v('id', '01a1e526…df69'), cast('THEMED', 'porcelain'), cast('HOME', '{}'), cast('DOCKED', '{}')]],
        ],
      }),
      mode('probe', 'home/probe', 'probe', '/runtime/house/mode/home/probe', [
        v('type', 'home'), v('slug', 'probe'), v('name', 'null'), v('version', '0.0.1'), v('daemon', 'null', { q: 'the runtime\u2019s own' }),
        v('traits', 'RUNTIME EXPOSED TOOLING DATASET'), v('metadata', 'aperture'), v('harness', 'null'), v('installed', '91a07b3c')], {
        secs: [['seats', [v('HOME', 'every terminal with no thread', { q: 'client trait' })]]],
      }),
      n('memo', 'daemon', {
        quiet: 'memo', dot: true, kind: 'daemon', title: 'memo', ref: '/daemon/memo', tr: 'b-memo',
        secs: [
          ['own', [v('id', 'memo', { q: '= slug' }), v('reference', '/daemon/memo'), v('version', '0.1.0'), v('status', 'HEALTHY'),
            v('statics', 'known English · learning Latin')]],
          ['mask', [v('modes', '@memo/domain/srs · @memo/topography/latin · @memo/srs/memo')]],
          ['aperture', [v('routes', 'pick review preview history suspend resume mode datamap entities metadata cortex status batch')]],
          ['stores', [v('$modes', '3'), v('$literals', '0'), v('$symbols', '0'), v('$notes', '0')]],
        ],
      }, [
        mode('srs-memo', 'srs/memo', 'Memo', MEMO, [
          v('type', 'srs'), v('slug', 'memo'), v('name', 'Memo'), v('version', '0.1.0'), v('installed', '91a07b3c'),
          v('description', 'Spaced-repetition flashcards on SM-2: drill in the frame or in conversation with the Magister'),
          v('module', 'null'), v('metadata', 'aperture · harness'), v('connection', 'IDLE')], {
          tail: 'seated',
          secs: [
            ['faces', [v('repl', '1 pattern'), cast('keymap', '0 patterns'), v('call', 'metadata deck grade stats chat entities emit harness')]],

            ['stores', [to('$turns', '8', 'turns', { bang: '!' }), to('$buffers', '1', 'buffers'), v('$views', '2'),
              v('$literals · $symbols · $notes · $files', '0 0 0 0')]],
          ],
        }, [
          n('memo.traits', 'traits', { quiet: '7', kind: 'traits', title: '7 worn', ref: `${MEMO}#traits`, tr: 'none' }, [
            trait('memo', MEMO, 'VIEWABLE', 'views', [v('$views', '2'), v('draws', 'frame · cell')]),
            trait('memo', MEMO, 'EMITTER', 'buffers', [to('route', '/emit/session', 'memo.a./emit/session')]),
            trait('memo', MEMO, 'EXPOSED', 'aperture', [v('metadata', 'aperture'), to('tree', 'aperture', 'memo.aperture')]),
            trait('memo', MEMO, 'HARNESSED', 'harness', [v('metadata', 'harness'), to('tree', 'harness', 'memo.harness')]),
            trait('memo', MEMO, 'CONVERSATIONAL', 'dialogue', [v('route', '/harness/dialogue/stream'), to('turns', '8', 'turns')]),
            trait('memo', MEMO, 'TOOLING', 'tools', [to('tools', '13', 'memo.tools')]),

          ]),

            [primer('memo', MEMO, 'magister', MAGISTER, [to('reads as', '[ memo ]', 'thread'), v('model', 'stub-middle')])],
            FACULTIES.map((name) => reference('memo', MEMO, name, [v('branches', { verbatim: '1', dialogue: '2', object: '2', choice: '1', picture: '1 · render' }[name])])),

              v('tune', 'fast', { q: 'repo · policy default' }), v('system keys', 'magister · language · today', { q: 'repo · per call' })]),
          n('memo.aperture', 'aperture', {
            quiet: 'routes', kind: 'aperture', title: 'memo', ref: `${MEMO}/metadata/aperture`, tr: 'none',
            secs: [['own', [v('landed with', 'EXPOSED'), v('call', '8 verbs', { q: 'mode.call' })]]],

              route('memo', MEMO, '/metadata/status', '{}', 'the host’s status', []),
              route('memo', MEMO, '/metadata/manifest', '{}', 'the mode’s manifest', []),
              route('memo', MEMO, '/metadata/emitter', '{}', 'the emitter route', []),
              route('memo', MEMO, '/metadata/aperture', '{}', 'this tree', []),
              route('memo', MEMO, '/metadata/harness/primer/(.*)', 'input', 'one primer, as a thread’s model reads it', [arg('thread', 'string', true)]),

const inv = (segs) => segs.map((s) => ({ ...s, c: `${s.c} inv` }));
const wrap = (text, w) => text.split('\n').flatMap((line) => {
  const words = line.split(' ');
  const lines = [''];
  for (const word of words) {
    const last = lines[lines.length - 1];
    if (last === '') lines[lines.length - 1] = word;
    else if ([...last].length + 1 + [...word].length <= w) lines[lines.length - 1] = `${last} ${word}`;
    else lines.push(word);
  }
  return lines;
});
const pane = (rows, w, count) =>
  Array.from({ length: count }, (_, index) => (index < rows.length ? fit(rows[index], w) : blank(w)));
const around = (rows, cur, room) => {
  if (rows.length <= room) return rows;
  const start = Math.max(0, Math.min(cur - Math.floor(room / 3), rows.length - room));
  return rows.slice(start, start + room);
};
const capped = (rows, room, w) => (rows.length <= room ? rows
  : [...rows.slice(0, room - 1), row([seg('m', ` … ${rows.length - room + 1} more`)], [], w)]);

const tree = (m, w) => {
  const tokens = m.lenses.map((l) => seg(l.on ? 'inv' : 'm', ` ${l.label}${l.n ? ` ${l.n}` : ''} `, l.pick));
  const strip = tokens.reduce((lines, token) => {
    const last = lines[lines.length - 1];
    return len(last) + len([token]) <= w - 1 ? [...lines.slice(0, -1), [...last, token]] : [...lines, [token]];
  }, [[]]).map((line) => row([seg('i', ' '), ...line], [], w));
  const head = [row([seg('m', ` ⌕ ${m.query === '' ? 'filter' : m.query}`)], [], w), ...strip];
  const rows = m.nodes.map((node) => {
    const left = [
      seg('i', ' '.repeat(1 + (node.depth <= 3 ? node.depth * 2 : 3 + node.depth)), node.pick),
      seg('m', node.sign === '' ? ' ' : node.sign, node.fold),
      seg('i', ' ', node.pick),
      seg(node.strong ? 's b' : 'i', node.name, node.pick),
      ...(node.quiet ? [seg('m', ` ${node.quiet}`, node.pick)] : []),
    ];
    const right = [
      ...(node.bang || node.tail ? [seg('i', ' ')] : []),
      ...(node.bang ? [seg('N b', '! ')] : []),
      ...(node.tail === 'dot' ? [seg('G', '●')] : node.tail === 'live' ? [seg('P', node.tailText)]
        : node.tail === 'count' ? [seg('m', node.tailText)] : []),
      seg('i', ' '),
    ];
    const built = row(left, right, w);
    return node.cur ? inv(built) : built;
  });
  const cur = m.nodes.findIndex((node) => node.cur);
  return [...head, ...around(rows, cur, BODY - head.length)];
};

const value = (r, w) => {
  const tone = r.cls.includes('is-fault') ? 'N' : r.cls.includes('is-cast') ? 'm' : 's';
  const TYPES = {
    text: () => (r.v === '' ? [[]] : wrap(r.v, w).map((line) => [seg(tone, line)])),
    link: () => [[seg('P', '→ '), seg('l', r.v, r.go)]],
    select: () => [[seg('s', r.v, r.cycle), seg('m', ' ▾', r.cycle)]],
    step: () => {
      const lit = Math.round((r.lit / r.of) * 8);
      return [[seg('P', '‹', r.less), seg('s', ` ${r.v} `), seg('P', '›', r.more), seg('i', ' '),
        seg('i', '▰'.repeat(lit)), seg('m', '▱'.repeat(8 - lit))]];
    },
    field: () => [[seg(r.v === '' ? 'm' : 's', r.v === '' ? 'name' : r.v)]],
    choice: () => r.opts.reduce((lines, o) => {
      const token = seg(o.on ? 'inv' : 'm', ` ${o.name} `, o.pick);
      const last = lines[lines.length - 1];
      return len(last) + len([token]) <= w || last.length === 0
        ? [...lines.slice(0, -1), [...last, token]] : [...lines, [token]];
    }, [[]]),
  };
  return TYPES[r.type]();
};

const kv = (r, w) => {
  const mark = r.cls.includes('is-changed') ? seg('P', '▎') : seg('i', ' ');
  const sub = r.cls.includes('is-sub') ? '  ' : '';
  const keyTone = r.cls.includes('is-worn') ? 's b' : r.cls.includes('is-cast') ? 'm' : 'i';
  const key = `${sub}${r.k}`;
  const keyText = [...key].length >= KEY ? `${[...key].slice(0, KEY - 2).join('')}… ` : key.padEnd(KEY);
  const q = [...r.q].length > 18 ? `${[...r.q].slice(0, 17).join('')}…` : r.q;
  const right = [...(q ? [seg('m', q)] : []), seg('i', ' ')];
  const room = w - 1 - KEY - len(right);
  const lines = value(r, room);
  return lines.map((line, index) => (index === 0
    ? row([mark, seg(keyTone, keyText), ...line, ...(r.bang ? [seg('N b', ' !')] : [])], right, w)
    : row([seg('i', ' '.repeat(1 + KEY)), ...line], [], w)));
};

const object = (m, w) => {
  const node = m.node;
  const acts = node.acts.map((a) => seg(a.on ? 'inv' : 'P', ` ${a.name} `, a.run));
  const head = [
    row([seg('m', ` ${node.kind.toUpperCase()} `), seg('s b', node.title)], [...acts, seg('i', ' ')], w),
    row([seg('i', ' '), ...node.crumbs.flatMap((c) => [seg('l', c.name, c.pick), seg('m', ' › ')]), seg('m', node.kind)], [], w),
    row([seg('m', ` ${node.ref}`)], [], w),
  ];
  const peek = node.peek === '' ? [] : [...wrap(node.peek, w - 3).map((line) => row([seg('i', ` ${line}`)], [], w)), blank(w)];
  const body = node.json !== ''
    ? node.json.split('\n').map((line) => row([seg('m', ` ${line}`)], [], w))
    : node.sections.flatMap((s) => [row([seg('m', ` ${s.label.toUpperCase()}`)], [], w), ...s.rows.flatMap((r) => kv(r, w))]);
  return capped([...head, ...peek, ...body], BODY, w);
};

const told = (d, stack, toggle, w) => (d === null ? [] : [
  blank(w),
  row([seg('m', ` ${d.path}`)], [], w),
  ...wrap(d.meta, w - 2).map((line) => row([seg('i', ` ${line}`)], [], w)),
  ...(d.fault ? [
    row([seg('N b', ` ${d.fault[0]}`)], [], w),
    ...wrap(d.fault[1], w - 2).map((line) => row([seg('N', ` ${line}`)], [], w)),
  ] : []),
  ...(d.input ? [row([seg('m', ' input '), seg('i', d.input)], [], w)] : []),
  ...d.recs.map((r) => row([seg('m', ` ${r.t.padEnd(6)}`), seg('i', r.k.padEnd(8)), seg(TONE[r.c], r.v)], [], w)),
  ...(d.stack ? [row([seg('m', ` ${stack ? '▾' : '▸'} stack`, toggle)], [], w)] : []),
  ...(d.stack && stack ? wrap(d.stack, w - 2).map((line) => row([seg('m', ` ${line}`)], [], w)) : []),
]);

const spanned = (s, w, bars) => {
  const pick = s.pick;
  const msTone = s.ms === 'live' ? 'P' : s.slow ? 'C' : 'm';
  const bar = bars === 0 ? [] : (() => {
    const from = Math.min(bars - 1, Math.round((Number(s.l) / 100) * bars));
    const span = Math.max(1, Math.min(bars - from, Math.round((Number(s.w) / 100) * bars)));
    return [seg('m', '·'.repeat(from), pick), seg(s.tone, '━'.repeat(span), pick),
      seg('m', '·'.repeat(bars - from - span), pick), seg('i', ' ')];
  })();
  const built = row([
    seg('i', ` ${'  '.repeat(Math.min(s.depth, 5))}`, pick), seg(s.tone, s.tone === 'm' ? '○' : '●', pick), seg('i', ' ', pick),
    seg(s.depth === 0 ? 's' : 'i', s.name, pick), ...(s.quiet ? [seg('m', ` ${s.quiet}`, pick)] : []),
    ...(s.bang ? [seg('N b', ' !', pick)] : []),
  ], [...bar, seg(msTone, s.ms.padStart(5), pick), seg('i', ' ')], w);
  return s.cur ? inv(built) : built;
};

const trace = (m, w) => {
  const t = m.trace;
  const head = row([seg('m', ' TRACE')], [
    seg(t.only === 'all' ? 'inv' : 'm', ` all ${t.nAll} `, () => t.setOnly('all')),
    seg(t.only === 'faults' ? 'inv' : 'N', ` ! ${t.nFaults} `, () => t.setOnly('faults')),
    seg('i', ' '),
  ], w);
  const rows = t.spans.map((s) => spanned(s, w, 0));
  const cur = t.spans.findIndex((s) => s.cur);
  const listed = rows.length ? around(rows, cur, 10) : [row([seg('m', ' no span touches this')], [], w)];
  return capped([head, ...listed, ...told(t.detail, m.stack, m.toggleStack, w)], BODY, w);
};

const logger = (m, w) => {
  const head = row([seg('i', ' '), ...m.logger.filters.map((f) =>
    seg(f.on ? 'inv' : f.id === 'faults' && f.n ? 'N' : 'm', ` ${f.id} ${f.n} `, f.pick))], [], w);
  const rows = m.logger.spans.map((s) => spanned(s, w, 24));
  const cur = m.logger.spans.findIndex((s) => s.cur);
  return [head, ...(rows.length ? around(rows, cur, BODY - 1) : [row([seg('m', ' no spans · the watermark moved')], [], w)])];
};

const header = (m) => row([
  seg('m', ' telemetry  '),
  seg(m.tab === 'inspector' ? 'inv' : 'm', ' inspector ', () => m.toTab('inspector')),
  seg('i', ' '),
  seg(m.tab === 'logger' ? 'inv' : 'm', ` logger ${m.records} `, () => m.toTab('logger')),
], [...(m.faults ? [seg('N b', ` ! ${m.faults} `, m.toFaults)] : []), seg('i', '  '), seg('m', 'esc', m.close), seg('i', ' ')], WIDE);

const KEYS = row([seg('P b', ' j k'), seg('m', ' move   '), seg('P b', 'l'), seg('m', ' open   '), seg('P b', 'h'),
  seg('m', ' back   '), seg('P b', 'tab'), seg('m', ' pane   '), seg('P b', '/'), seg('m', ' filter   '),
  seg('P b', 'y'), seg('m', ' copy   '), seg('P b', 't'), seg('m', ' logger   '), seg('P b', 'esc'), seg('m', ' close')], [], WIDE);

const joined = (panes, widths) => Array.from({ length: BODY }, (_, index) =>
  panes.flatMap((rows, at) => [...(at ? [seg('bd', '│')] : []), ...pane(rows, widths[at], BODY)[index]]));

const lines = (m) => {
  if (!m.open) {
    return [
      { c: 'lf', segs: row([seg('m', ' telemetry closed   '), seg('P', ' open ', m.reopen)], [seg('m', 'leader s t ')], WIDE) },
      ...Array.from({ length: BODY + 2 }, () => ({ c: '', segs: blank(WIDE) })),
    ];
  }
  const body = m.tab === 'inspector'
    ? joined([tree(m, COLS[0]), object(m, COLS[1]), trace(m, COLS[2])], COLS)
    : joined([logger(m, LOG[0]), told(m.logger.detail, m.stack, m.toggleStack, LOG[1])], LOG);
  return [
    { c: 'lf', segs: header(m) },
    ...body.map((segs) => ({ c: '', segs })),
    { c: '', segs: [seg('bd', '─'.repeat(WIDE))] },
    { c: '', segs: KEYS },
  ];
};

class Component extends DCLogic {
  state = INITIAL();
  theme() { return this.state.changed.includes('app.theme') ? this.state.vals['app.theme'] : (this.props.theme ?? 'northsea'); }
  themed() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidMount() { this.themed(); }
  componentDidUpdate() { this.themed(); }
  renderVals() {
    const m = derive(this, {});
    return {
      lines: lines(m).map((line) => ({
        c: line.c,
        segs: line.segs.map((s) => ({ c: s.c, t: s.t, go: s.go, btn: s.go !== null, txt: s.go === null })),
      })),
    };
  }
}
</script>
</body>
</html>
