<main class="rd-frame">

<sc-if value="{{showEmpty}}" hint-placeholder-val="{{ true }}">
<div class="rd-empty">
<div class="card">
<svg class="rd-glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 6h26l10 10v42H14z"></path><path d="M40 6v10h10"></path><path d="M21 27h22M21 34h22M21 41h15"></path><path d="M21 48h8" stroke-dasharray="2 3"></path></svg>
<div class="big">no article in the buffer</div>
<div class="kit-field is-repl" style="min-height: 44px">
<span class="p">/add</span>
<input aria-label="article url" placeholder="https://example.org/tides">
<button class="kit-seg" style="color: var(--signal-primary-ink); box-shadow: inset 0 0 0 1px var(--signal-primary-ink)" onClick="{{add}}">add</button>
</div>
<div class="rd-recent">
<span class="kit-label">currently reading</span>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<button class="rd-rec" onClick="{{r.pick}}"><span class="sign">◆</span><span class="t">{{r.title}}</span><span class="kit-meter"><i style="--v: {{r.pct}}%"></i></span><span class="v">{{r.left}} left · {{r.mins}} min</span></button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{parsing}}" hint-placeholder-val="{{ false }}">
<div class="rd-empty">
<div class="rd-load" role="status" aria-label="processing article">

<div class="kit-meter bar"><i style="--v: {{loadPct}}%"></i></div>

<div class="{{st.cls}}"><span class="kit-dot {{st.dot}}"></span><span class="n">{{st.name}}</span><span class="v">{{st.val}}</span></div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{loaded}}" hint-placeholder-val="{{ false }}">
<div class="rd-top">
<span class="kit-dot {{parseDot}}"></span>
<span class="src">example.org/tides</span>
<sc-if value="{{refining}}" hint-placeholder-val="{{ false }}"><span class="kit-label">refining</span></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["empty","article","midway"],"default":"empty"},"theme":{"editor":"enum","options":["northsea","parchment","porcelain","datasette"],"default":"northsea"},"size":{"editor":"range","min":14,"max":28,"step":1,"unit":"px","default":18},"$preview":{"width":1440,"height":900}}'>
var RD_BLOCKS = [
  { id: 'b1', kind: 'h1', text: 'How a Tide Table Is Made' },
  { id: 'b2', kind: 'p', text: 'A tide table looks like a list of observations, but almost none of it was observed. The times and heights printed for next March are predictions. They are computed from a few dozen numbers that describe how the moon and the sun pull on one particular stretch of coast.' },
  { id: 'b3', kind: 'image', cap: 'Sea level at one gauge over a lunar month. Two tides a day, swelling at springs and shrinking at neaps.' },
  { id: 'b4', kind: 'p', text: 'Those numbers come from a gauge. A float in a stilling well, or today a radar pointed at the water, records the sea level every few minutes. A month of that record already shows the pattern: two highs and two lows a day, drifting about fifty minutes later each day, swelling and shrinking every two weeks.' },
  { id: 'b5', kind: 'h2', text: 'Harmonic constituents' },
  { id: 'b6', kind: 'p', text: 'The trick, worked out in the nineteenth century, is to treat that messy curve as a sum of clean waves. Each wave has a period fixed by astronomy. Only its height and its timing are local. Fit those to a year of gauge data and the harbour is described.' },
  { id: 'b7', kind: 'list', items: ['M2, the principal lunar wave: 12.42 hours.', 'S2, the principal solar wave: 12.00 hours.', 'K1, the luni-solar diurnal wave: 23.93 hours.', 'O1, the principal lunar diurnal wave: 25.82 hours.'] },
  { id: 'b8', kind: 'p', text: 'Four waves get you most of the way. Busy ports use sixty or more, because shallow water bends the tide and creates overtones that a handful of constituents cannot carry.' },
  { id: 'b9', kind: 'movie', cap: 'A brass tide-predicting machine running through a year of tides.' },
  { id: 'b10', kind: 'quote', text: 'The sea keeps its own time, but it reads it from an astronomical clock.' },
  { id: 'b11', kind: 'p', text: 'Before computers, the sum was done in brass. A tide-predicting machine turns one pulley per constituent, each geared to its period. A wire running over all of them draws the predicted curve for a whole year in an afternoon.' },
  { id: 'b12', kind: 'embed', cap: 'Interactive: the predicted curve for this week, the present moment marked.' },
  { id: 'b13', kind: 'p', text: 'What the table cannot hold is weather. A strong onshore wind or a deep low can lift the water well above the printed height. The prediction is a floor to plan from, never a promise.' }
];
var RD_TEXT = ['h1', 'h2', 'p', 'list', 'quote'];
var RD_SWIPE = 110;
var RD_RECENT = [
  ['How a Tide Table Is Made', 9, 31, 2],
  ['Notes on Lighthouse Optics', 4, 78, 1],
  ['The Arithmetic of Container Ships', 17, 6, 7]
];
var RD_STEPS = [
  ['fetch', '200 · text/html · 48 kB'],
  ['snapshot', 'original · sandboxed'],
  ['parse', '13 blocks'],
  ['assets', 'image 1 · movie 1 · embed 1'],
  ['layout', 'reader · opendyslexic']
];
var RD_LEAD = { tight: 1.5, normal: 1.7, loose: 1.95 };
var RD_MEASURE = { narrow: '28em', normal: '34em', wide: '42em' };
function rdSens(b) {
  if (b.kind === 'list') return b.items;
  if (b.kind === 'h1' || b.kind === 'h2') return [b.text];
  return b.text.split(/(?<=[.!?:])\s+(?=[A-Z])/);
}
function rdIsText(b) { return RD_TEXT.indexOf(b.kind) >= 0; }
function rdTurn(kind, text) {
  var reg = { cmd: 'you', tool: 'tool', trace: '·' }[kind] || '';
  return { kind: kind, text: text, reg: reg, cls: 'kit-turn is-' + (kind === 'cmd' ? 'command' : kind), isCmd: kind === 'cmd' };
}
var RD_ADDED = [
  rdTurn('trace', 'buffer b1 · reader · empty'),
  rdTurn('cmd', '/add https://example.org/tides'),
  rdTurn('tool', 'fetch · 200 · text/html · 48 kB'),
  rdTurn('tool', 'snapshot · original · sandboxed'),
  rdTurn('tool', 'parse · deterministic · 13 blocks · image 1 · movie 1 · embed 1')
];

class Component extends DCLogic {
  S() {
    var p = this.props.start || 'empty';
    var mid = p === 'midway';
    var d = {
      loaded: p !== 'empty',
      parsing: false,
      face: 'reader',
      parse: 'deterministic',
      done: mid ? ['b1', 'b2', 'b3', 'b4'] : [],
      cur: mid ? { id: 'b6', si: 1 } : null,
      speaking: false,
      audio: false,
      stage: 0,
      hintOpen: false,
      font: 'dyslexic',
      size: this.props.size ?? 18,
      lead: 'normal',
      measure: 'normal',
      setOpen: false,
      drag: null,
      rate: 1,
      log: p === 'empty' ? [rdTurn('trace', 'buffer b1 · reader · empty')] :
        mid ? RD_ADDED.concat([rdTurn('cmd', '/done b1'), rdTurn('cmd', '/done b2'), rdTurn('cmd', '/done b3'), rdTurn('cmd', '/done b4'), rdTurn('cmd', '/speak from b6'), rdTurn('cmd', '/pause')]) : RD_ADDED
    };
    return Object.assign(d, this.state || {});
  }
  put(patch, cb) { this.setState(Object.assign(this.S(), patch), cb); }
  say(s, kind, text) { return s.log.concat([rdTurn(kind, text)]); }

  componentDidMount() { this.theme(); this.follow(); }
  componentDidUpdate() { this.theme(); this.follow(); }
  componentWillUnmount() { this.hush(); }
  theme() { try { document.documentElement.setAttribute('data-theme', this.props.theme || 'northsea'); } catch (e) {} }
  follow() {
    var c = this.S().cur;
    var id = c ? c.id + ':' + c.si : null;
    if (!id || id === this.seen) return;
    this.seen = id;
    var el = document.getElementById('blk-' + c.id);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  hush() {
    this.tok = (this.tok || 0) + 1;
    clearTimeout(this.timer);
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }
  step(s, dir) {
    if (!s.cur) return null;
    var live = RD_BLOCKS.filter(function (b) { return rdIsText(b) && s.done.indexOf(b.id) < 0; });
    var i = live.findIndex(function (b) { return b.id === s.cur.id; });
    if (i < 0) {
      var oi = RD_BLOCKS.findIndex(function (b) { return b.id === s.cur.id; });
      var nb = live.find(function (b) { return RD_BLOCKS.indexOf(b) > oi; });
      return nb ? { id: nb.id, si: 0 } : null;
    }
    var si = s.cur.si + dir;
    if (si >= 0 && si < rdSens(live[i]).length) return { id: s.cur.id, si: si };
    var j = i + dir;
    if (j < 0 || j >= live.length) return null;
    return { id: live[j].id, si: dir > 0 ? 0 : rdSens(live[j]).length - 1 };
  }
  speakNow() {
    var self = this;
    var s = this.S();
    if (!s.speaking || !s.cur) return;
    var b = RD_BLOCKS.find(function (x) { return x.id === s.cur.id; });
    var text = rdSens(b)[s.cur.si];
    this.hush();
    var tok = this.tok;
    var go = function () { if (self.tok === tok) self.advance(); };
    var est = text.split(/\s+/).length / 2.6 / s.rate * 1000 + 300;
    var synth = window.speechSynthesis;
    if (synth && window.SpeechSynthesisUtterance) {
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.rate = s.rate;
        u.onend = go;
        u.onerror = function () { clearTimeout(self.timer); self.timer = setTimeout(go, est); };
        synth.speak(u);
        this.timer = setTimeout(go, est * 2.5);
        return;
      } catch (e) {}
    }
    this.timer = setTimeout(go, est);
  }
  advance() {
    var s = this.S();
    if (!s.speaking) return;
    var n = this.step(s, 1);
    if (!n) { this.put({ speaking: false, log: this.say(s, 'trace', 'end of article') }); return; }
    var self = this;
    this.put({ cur: n }, function () { self.speakNow(); });
  }
  play() {
    var s = this.S();
    var self = this;
    var first = RD_BLOCKS.find(function (b) { return rdIsText(b) && s.done.indexOf(b.id) < 0; });
    var cur = s.cur && s.done.indexOf(s.cur.id) < 0 ? s.cur : (first ? { id: first.id, si: 0 } : null);
    if (!cur) return;
    this.put({ speaking: true, cur: cur, log: this.say(s, 'cmd', '/speak') }, function () { self.speakNow(); });
  }
  pause() {
    this.hush();
    var s = this.S();
    this.put({ speaking: false, log: this.say(s, 'cmd', '/pause') });
  }
  from(id) {
    var s = this.S();
    var self = this;
    this.put({ speaking: true, cur: { id: id, si: 0 }, log: this.say(s, 'cmd', '/speak from ' + id) }, function () { self.speakNow(); });
  }
  skip(dir) {
    var s = this.S();
    var n = this.step(s, dir);
    if (!n) return;
    var self = this;
    this.put({ cur: n }, function () { if (s.speaking) self.speakNow(); });
  }
  done(id) {
    var s = this.S();
    var nd = s.done.concat([id]);
    var cur = s.cur;
    var moved = false;
    if (cur && cur.id === id) { cur = this.step(Object.assign({}, s, { done: nd }), 1); moved = true; }
    var self = this;
    var patch = { done: nd, cur: cur, drag: null, settle: true, log: this.say(s, 'cmd', '/done ' + id) };
    if (moved && !cur) { this.hush(); patch.speaking = false; }
    this.put(patch, function () {
      var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
      raf(function () { raf(function () { self.put({ settle: false }); }); });
      if (moved && cur && s.speaking) self.speakNow();
    });
  }
  undo() {
    var s = this.S();
    if (!s.done.length) return;
    var id = s.done[s.done.length - 1];
    this.put({ done: s.done.slice(0, -1), log: this.say(s, 'cmd', '/undo ' + id) });
  }
  face(f) {
    var s = this.S();
    if (s.face === f) return;
    this.put({ face: f, log: this.say(s, 'cmd', '/face ' + f) });
  }
  rate(r) {
    var s = this.S();
    var self = this;
    this.put({ rate: r, log: this.say(s, 'cmd', '/rate ' + r) }, function () { if (s.speaking) self.speakNow(); });
  }
  add() {
    var s = this.S();
    var self = this;
    this.put({ parsing: true, stage: 0, log: this.say(s, 'cmd', '/add https://example.org/tides') });
    var tick = function () {
      var t = self.S();
      if (t.stage + 1 < RD_STEPS.length) { self.put({ stage: t.stage + 1 }); setTimeout(tick, 520); }
      else setTimeout(function () { var u = self.S(); self.put({ parsing: false, loaded: true, stage: RD_STEPS.length, log: u.log.concat(RD_ADDED.slice(2)) }); }, 420);
    };
    setTimeout(tick, 520);
  }
  refine() {
    var s = this.S();
    var self = this;
    if (s.parse === 'refining') return;
    this.put({ parse: 'refining', hintOpen: false, log: this.say(s, 'cmd', '/refine') });
    setTimeout(function () {
      var t = self.S();
      self.put({ parse: 'agentic', log: t.log.concat([rdTurn('tool', 'refine · agentic · boundaries 2 · alt text 1 · 13 blocks')]) });
    }, 1200);
  }

  swDown(e, id) {
    if (e.button > 0) return;
    if (e.target && e.target.closest && e.target.closest('button, a, input')) return;
    this.sw = { id: id, x: e.clientX, y: e.clientY, live: false, pid: e.pointerId, el: e.currentTarget };
  }
  swMove(e) {
    var w = this.sw;
    if (!w) return;
    var dx = e.clientX - w.x, dy = e.clientY - w.y;
    if (!w.live) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { this.sw = null; return; }
      if (Math.abs(dx) < 12) return;
      w.live = true;
      try { w.el.setPointerCapture(w.pid); } catch (err) {}
      try { window.getSelection().removeAllRanges(); } catch (err) {}
    }
    this.put({ drag: { id: w.id, dx: dx, live: true } });
  }
  swUp(e) {
    var w = this.sw;
    this.sw = null;
    if (!w || !w.live) return;
    var self = this;
    var dx = e.clientX - w.x;
    if (Math.abs(dx) > RD_SWIPE) {
      this.put({ drag: { id: w.id, dx: dx > 0 ? 900 : -900, live: false } });
      setTimeout(function () { self.done(w.id); }, 200);
    } else {
      this.put({ drag: { id: w.id, dx: 0, live: false } });
      setTimeout(function () { self.put({ drag: null }); }, 220);
    }
  }
  pref(key, val, line) {
    var s = this.S();
    var patch = { log: this.say(s, 'cmd', line) };
    patch[key] = val;
    this.put(patch);
  }

  renderVals() {
    var self = this;
    var s = this.S();
    var cur = s.cur;
    var live = RD_BLOCKS.filter(function (b) { return s.done.indexOf(b.id) < 0; });
    var blocks = live.map(function (b) {
      var txt = rdIsText(b);
      var reading = !!(s.audio && cur && cur.id === b.id);
      var sens = txt ? rdSens(b).map(function (t, i) {
        return { t: t + ' ', cls: reading && cur.si === i ? 'sen is-cur' : 'sen' };
      }) : [];
      var dg = s.drag && s.drag.id === b.id ? s.drag : null;
      var ddx = dg ? dg.dx : 0;
      return {
        id: b.id, cap: b.cap || '', sens: sens, domId: 'blk-' + b.id,
        dx: ddx,
        op: Math.max(0.2, 1 - Math.abs(ddx) / 520).toFixed(2),
        down: function (e) { self.swDown(e, b.id); },
        move: function (e) { self.swMove(e); },
        up: function (e) { self.swUp(e); },
        cls: 'blk k-' + b.kind + (reading ? ' is-reading' : '') + (dg && dg.live ? ' is-drag' : '') + (dg && dg.live && Math.abs(ddx) > RD_SWIPE ? ' is-armed' : ''),
        fromCls: 'act from' + (reading ? ' is-on' : ''),
        canSpeak: txt && s.audio,
        isH1: b.kind === 'h1', isH2: b.kind === 'h2', isP: b.kind === 'p', isQuote: b.kind === 'quote', isList: b.kind === 'list',
        isImage: b.kind === 'image', isMovie: b.kind === 'movie', isEmbed: b.kind === 'embed',
        done: function () { self.done(b.id); },
        from: function () { self.from(b.id); }
      };
    });
    var rail = RD_BLOCKS.map(function (b) {
      var d = s.done.indexOf(b.id) >= 0;
      return {
        label: b.id + ' · ' + b.kind + (d ? ' · done' : ''),
        cls: 'rd-cell' + (d ? ' is-done' : rdIsText(b) ? '' : ' is-media') + (s.audio && cur && cur.id === b.id ? ' is-cur' : ''),
        pick: function () { if (!d && rdIsText(b)) { if (s.audio) self.from(b.id); else { var el = document.getElementById('blk-' + b.id); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } } }
      };
    });
    var cb = cur ? RD_BLOCKS.find(function (x) { return x.id === cur.id; }) : null;
    var cs = cb ? rdSens(cb) : [];
    var senCells = cs.map(function (_, i) { return { cls: i < cur.si ? 'is-past' : i === cur.si ? 'is-cur' : '' }; });
    var total = RD_BLOCKS.length;
    var rates = [0.8, 1, 1.25, 1.5].map(function (r) {
      return { label: r + '×', on: s.rate === r ? 'true' : 'false', pick: function () { self.rate(r); } };
    });
    return {
      showEmpty: !s.loaded && !s.parsing,
      parsing: s.parsing,
      loaded: s.loaded,
      parse: s.parse,
      parseDot: s.parse === 'refining' ? 'is-healthy rd-busy' : 'is-healthy',
      refining: s.parse === 'refining',
      hintOpen: s.hintOpen,
      hintOpenA: s.hintOpen ? 'true' : 'false',
      toggleHint: function () { self.put({ hintOpen: !s.hintOpen }); },
      loadPct: Math.round(Math.min(s.stage, RD_STEPS.length) / RD_STEPS.length * 100),
      steps: RD_STEPS.map(function (st, i) {
        var state = i < s.stage ? 'done' : i === s.stage ? 'now' : 'next';
        return {
          name: st[0],
          val: state === 'done' ? st[1] : state === 'now' ? '…' : '',
          dot: state === 'done' ? 'is-healthy' : state === 'now' ? 'is-running' : '',
          cls: 'rd-step-row is-' + state
        };
      }),
      face: s.face,
      faceO: s.face === 'original' ? 'true' : 'false',
      faceR: s.face === 'reader' ? 'true' : 'false',
      faceCls: 'f-' + s.face,
      isOriginal: s.face === 'original',
      size: s.size,
      font: s.font,
      lh: RD_LEAD[s.lead],
      measure: RD_MEASURE[s.measure],
      setOpen: s.setOpen,
      setOpenA: s.setOpen ? 'true' : 'false',
      setSeg: 'kit-seg' + (s.setOpen ? ' is-open' : ''),
      toggleSet: function () { self.put({ setOpen: !s.setOpen }); },
      sizeDown: function () { if (s.size > 14) self.pref('size', s.size - 1, '/set size ' + (s.size - 1)); },
      sizeUp: function () { if (s.size < 28) self.pref('size', s.size + 1, '/set size ' + (s.size + 1)); },
      optFont: ['dyslexic', 'sans', 'serif'].map(function (v) { return { label: v, on: s.font === v ? 'true' : 'false', pick: function () { self.pref('font', v, '/set type ' + v); } }; }),
      optLead: ['tight', 'normal', 'loose'].map(function (v) { return { label: v, on: s.lead === v ? 'true' : 'false', pick: function () { self.pref('lead', v, '/set lines ' + v); } }; }),
      optMeasure: ['narrow', 'normal', 'wide'].map(function (v) { return { label: v, on: s.measure === v ? 'true' : 'false', pick: function () { self.pref('measure', v, '/set width ' + v); } }; }),
      optAudio: [false, true].map(function (v) {
        return { label: v ? 'on' : 'off', on: s.audio === v ? 'true' : 'false', pick: function () {
          if (s.audio === v) return;
          if (!v) self.hush();
          self.put({ audio: v, speaking: false, log: self.say(s, 'cmd', '/set audio ' + (v ? 'on' : 'off')) });
        } };
      }),
      blocks: blocks,
      rail: rail,
      total: total,
      recent: RD_RECENT.map(function (r) {
        return { title: r[0], left: r[1], pct: r[2], mins: r[3], pick: function () {
          var t = self.S();
          self.put({ loaded: true, done: ['b1', 'b2', 'b3', 'b4'], log: self.say(t, 'cmd', '/open ' + r[0]) });
        } };
      }),
      settleCls: s.settle ? 'is-settling' : '',
      left: live.length,
      mins: Math.max(1, Math.ceil(live.reduce(function (n, b) { return n + (rdIsText(b) ? rdSens(b).join(' ').split(/\s+/).length : 0); }, 0) / 200)),
      pct: Math.round(s.done.length / total * 100),
      noUndo: s.done.length === 0,
      bufName: s.loaded ? 'how a tide table is made' : 'empty',
      speaking: s.speaking,
      notSpeaking: !s.speaking,
      liveCls: s.speaking ? 'is-live' : '',
      playLabel: s.speaking ? 'pause' : 'speak',
      spkDot: s.speaking ? 'is-running' : '',
      pos: cur ? cur.id + ' · ' + (cur.si + 1) + '/' + cs.length : '—',
      senCells: senCells,
      nowText: cur ? cs[cur.si] : 'press play, or speak from any block',
      rates: rates,
      rateLabel: s.rate + '×',
      log: s.log.slice().reverse(),
      add: function () { self.add(); },
      refine: function () { self.refine(); },
      undo: function () { self.undo(); },
      toOriginal: function () { self.face('original'); },
      toReader: function () { self.face('reader'); },
      audio: s.audio,
      audioOn: s.audio ? 'true' : 'false',
      audioSeg: 'kit-seg' + (s.audio ? ' is-open' : ''),
      toggleAudio: function () {
        if (s.audio) self.hush();
        self.put({ audio: !s.audio, speaking: false, log: self.say(s, 'cmd', '/audio ' + (s.audio ? 'off' : 'on')) });
      },
      toggleFace: function () { self.face(s.face === 'reader' ? 'original' : 'reader'); },
      togglePlay: function () { if (s.speaking) self.pause(); else self.play(); },
      prev: function () { self.skip(-1); },
      next: function () { self.skip(1); }
    };
  }
}
