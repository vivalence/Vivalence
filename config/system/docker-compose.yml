  runtimes:
    # build:
    #   context: ..
    #   dockerfile: system/daemon/Dockerfile
    image: vivalence/daemon
    container_name: viva-runtimes
    # command: ["deno", "task", "daemon:watch"]
    ports:
      - "${DAEMON_PORT:-1729}:1729"
    environment:
      - VIVA_SYSTEM_MODE=${VIVA_SYSTEM_MODE:-DEVELOPMENT}
      - VIVA_SYSTEM_ROLE=DAEMON
      - VIVA_SYSTEM_VARIANT=${VIVA_SYSTEM_MODE:-DEVELOPMENT}_DAEMON
      - VIVA_REPOSITORY_DIR=/viva/repository
      - VIVA_CONFIG_DIR=/viva/repository/config
      - VIVA_REGISTER_DIR=/viva/repository/register

    # //   VIVA_DAEMON_URL: `http://${daemon.server.domain}:${daemon.server.port}`,
    # //   VIVA_CLIENTS_WEB_URL: `http://${clients.web.domain}:${clients.web.port}`,
    # //   VIVA_DAEMON_DOMAIN: daemon.server.domain,
    # //   VIVA_DAEMON_PORT: daemon.server.port,
    # //   VIVA_CLIENTS_WEB_DOMAIN: clients.web.domain,
    # //   VIVA_CLIENTS_WEB_PORT: clients.web.port,

    # VIVA_REPOSITORY_DIR="/Users/finn/vivalence/code/vivalence"
    # VIVA_REGISTER_DIR="/Users/finn/vivalence/code/vivalence/register"
    # VIVA_CONFIG_DIR="/Users/finn/viva"

    # "VIVA_LIGHTHOUSE_URL": "http://localhost:5175/attached/runtime/eng2lat/service/identity",
    # "JWT_SECRET": "jmJn5XBFk0gBlCmRoHL6pgZJz3edjNey",

    volumes:
      # root config dir should be configurable
      - ${VIVA_CONFIG_DIR:-../config}:/viva/repository/config
    networks:
      - viva-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1729/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: vivalence/web
    container_name: viva-web
    command: ["deno", "task", "web:watch"]
    ports:
      - "${VIVA_CLIENTS_WEB_PORT:-80}:3000"
    environment:
      - VIVA_SYSTEM_MODE=${VIVA_SYSTEM_MODE:-DEVELOPMENT}
      - VIVA_SYSTEM_ROLE=CLIENT
      - VIVA_SYSTEM_VARIANT=${VIVA_SYSTEM_MODE:-DEVELOPMENT}_CLIENT
      - PUBLIC_VIVA_LIGHTHOUSE_URL=https://runtimes.vivalence.com/attached/runtime/eng2lat/service/identity
      - PUBLIC_VIVA_CLIENTS_WEB_URL=http://localhost:80
      - VIVA_CONFIG_DIR=/viva/config

    volumes:
      - ${VIVA_CONFIG_DIR:-../config}:/viva/config
    networks:
      - viva-network
    restart: unless-stopped
