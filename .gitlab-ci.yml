workflow:
  rules:
    - when: always

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY: registry.vivalence.org/beef/viva # might i not better inject this as a build var???

build-and-push:
  stage: build
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  rules:
    - when: always

  script:
    - export VIVA_STAMP="$CI_COMMIT_SHORT_SHA $CI_COMMIT_SHORT_SHA $CI_COMMIT_TIMESTAMP"

    - docker build -f ./Dockerfile -t vivalence/viva:alpine -t vivalence/viva:$CI_COMMIT_SHORT_SHA .
    - docker build -f ./systems/runtime/Dockerfile -t vivalence/runtime:alpine .
    - docker build --build-arg VIVA_BASE=vivalence/viva:$CI_COMMIT_SHORT_SHA --build-arg VIVA_STAMP="$VIVA_STAMP" -f ./systems/kajuit/Dockerfile -t vivalence/kajuit:alpine .
    - docker build -f ./documentation/Dockerfile -t vivalence/documentation:alpine .

    - |
      for image in viva runtime kajuit documentation; do
        docker tag vivalence/$image:alpine $REGISTRY/vivalence/$image:alpine
        docker tag vivalence/$image:alpine $REGISTRY/vivalence/$image:$CI_COMMIT_SHORT_SHA
        docker push $REGISTRY/vivalence/$image:alpine
        docker push $REGISTRY/vivalence/$image:$CI_COMMIT_SHORT_SHA
      done
deploy-kajuit:
  stage: deploy
  image: curlimages/curl:latest
  needs: [build-and-push]
  rules:
    - if: $COOLIFY_TOKEN && $COOLIFY_BASE
  script:
    - curl --fail -H "Authorization:Bearer $COOLIFY_TOKEN" "$COOLIFY_BASE?uuid=xkgcgwck8k08cgs8okoo4sko"

deploy-runtime:
  stage: deploy
  image: curlimages/curl:latest
  needs: [build-and-push]
  rules:
    - if: $COOLIFY_TOKEN && $COOLIFY_BASE
  script:
    - curl --fail -H "Authorization:Bearer $COOLIFY_TOKEN" "$COOLIFY_BASE?uuid=egcwkgw0cwg0kkwko4owooco"

