<!doctype html>
<html lang="en" data-theme="nordic">
	<head>
		<meta charset="utf-8" />
		<script>
			try {
				const bridge = JSON.parse(localStorage.getItem("vivalence:bridge"));
				if (bridge?.view?.theme) document.documentElement.dataset.theme = bridge.view.theme;
			} catch (_) {}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=overlays-content, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script> -->
		<!-- <script>eruda.init();</script> -->
		<style>
			:root {
				--safe-area-top: env(safe-area-inset-top, 0px);
				--safe-area-bottom: env(safe-area-inset-bottom, 0px);
				--safe-area-left: env(safe-area-inset-left, 0px);
				--safe-area-right: env(safe-area-inset-right, 0px);
			}
			html,
			body {
				background: darkgray;
			}
			body {
				padding-top: var(--safe-area-top);
				padding-left: var(--safe-area-left);
				padding-right: var(--safe-area-right);
				padding-bottom: var(--safe-area-bottom);
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%
	</body>
	<script type="importmap">
		{
			"imports": {
				"svelte/internal/disclose-version": "https://esm.sh/svelte@5.39.6/internal/disclose-version",
				"svelte/internal/client": "https://esm.sh/svelte@5.39.6/internal/client",
				"svelte/internal/": "https://esm.sh/svelte@5.39.6/internal/",
				"svelte": "https://esm.sh/svelte@5.39.6",
				"carbon-icons-svelte/": "https://esm.sh/carbon-icons-svelte@13/"
			}
		}
	</script>
</html>
