<!doctype html>
<html lang="en" data-theme="northsea">
	<head>
		<meta charset="utf-8" />
		<script>
			try {
				const bridge = JSON.parse(localStorage.getItem("vivalence:bridge"));
				if (["northsea", "parchment", "porcelain", "datasette"].includes(bridge?.view?.theme)) document.documentElement.dataset.theme = bridge.view.theme;
			} catch (_) {}
		</script>
		<link rel="icon" href="/favicon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=overlays-content, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<style>
			:root {
				--safe-area-top: env(safe-area-inset-top, 0px);
				--safe-area-bottom: env(safe-area-inset-bottom, 0px);
				--safe-area-left: env(safe-area-inset-left, 0px);
				--safe-area-right: env(safe-area-inset-right, 0px);
			}
			html,
			body {
				margin: 0;
				background: darkgray;
			}
		</style>
		<script type="module" src="./client.js"></script>
	</head>
	<body data-zone="1"></body>
</html>
