name: nlp-stanza

services:
  stanza-nlp:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: vivalence-service_nlp-stanza
    command: "./entrypoint.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVICE_PORT}/status"]
      interval: 30s
      timeout: 10s
      retries: 6
    ports:
      - "${SERVICE_PORT}:${SERVICE_PORT}"
    volumes:
      - "${SERVICE_MOUNT}/mnt:/app/stanza/mnt"
    environment:
      - STANZA_RESOURCES_DIR=/app/stanza/mnt/stanza_resources
      - STANZA_LANGUAGES=${STANZA_LANGUAGES}
      - STANZA_PROCESSORS=${STANZA_PROCESSORS}
      - STANZA_PACKAGE=${STANZA_PACKAGE}
      - SERVICE_WORKERS=${SERVICE_WORKERS}
      - SERVICE_PORT=${SERVICE_PORT}
