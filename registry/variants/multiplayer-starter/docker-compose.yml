volumes:
  mountpoint:
    driver: local
  variant:
    driver: local

services:
  runtime:
    image: vivalence/runtime:alpine
    container_name: runtime
    ports:
      - "1729:1729"
    environment:
      - VIVA_SYSTEM_MODE=PRODUCTION
      - VIVA_SYSTEM_ROLE=RUNTIME
      - VIVA_CIRCUITRY_MOUNT=/viva/repository/registry/variants/multiplayer-starter
      - VIVA_VARIANT_MOUNT=/viva/variant
      - VIVA_MOUNTPOINT_MOUNT=/viva/mountpoint
      - VIVA_RUNTIME_SERVE=http://0.0.0.0:1729
      - VIVA_LIGHTHOUSE_SERVE=http://0.0.0.0:1729/attached/process/lighthouse/hanse
      - PUBLIC_VIVA_RUNTIME_REMOTE=https://kajuit.s4y.vivalence.com
      - PUBLIC_VIVA_LIGHTHOUSE_REMOTE=https://kajuit.s4y.vivalence.com/attached/process/lighthouse/hanse
      - JWT_SECRET=abcaslfkslfalfjasf
    volumes:
      - variant:/viva/variant
      - mountpoint:/viva/mountpoint

  html:
    image: vivalence/html:alpine
    container_name: html
    restart: unless-stopped
    ports:
      - "1794:1794"
    environment:
      - VIVA_SYSTEM_MODE=PRODUCTION
      - VIVA_SYSTEM_ROLE=CLIENT
      - VIVA_CIRCUITRY_MOUNT=/viva/repository/registry/variants/multiplayer-starter
      - VIVA_CLIENT_HTML_SERVE=http://0.0.0.0:1794
      - PUBLIC_VIVA_LIGHTHOUSE_REMOTE=https://kajuit.s4y.vivalence.com/attached/process/lighthouse/hanse
      - PUBLIC_VIVA_CLIENT_HTML_REMOTE=https://vivalence.com
